name: FullRun assembly (lifeos-ci)
run-name: FullRun ${{ inputs.job_name }} → ${{ inputs.target_repo }}@${{ inputs.branch }} (depuis ${{ inputs.start_phase }}, tentative ${{ inputs.attempt }})

on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Dépôt cible (liste blanche targets/allowed-repos.sh)"
        type: choice
        required: true
        default: antenly
        options:
          - antenly
          - antenly-ci
          - galass-ci
          - Galass_Rider
          - Galass_Driver
          - Galass_backend
          - galass-emu-actions-pub
          - lifeos
          - lifeos-ci
      extra_repos:
        description: "Dépôts supplémentaires, séparés par des virgules ou espaces (vide = aucun)"
        type: string
        required: false
        default: ""
      lifeos_write:
        description: "Autoriser l'écriture vers LordThiouk/lifeos (branche + PR uniquement)"
        type: boolean
        required: false
        default: false
      branch:
        description: "Branche de fonctionnalité du dépôt cible, déjà poussée (jamais main/master)"
        type: string
        required: true
      prompt_path:
        description: "prompts:<chemin sur fullrun-prompts de lifeos-ci> ou target:<chemin sur la branche cible>"
        type: string
        required: true
      isa_path:
        description: "Chemin optionnel de l'ISA sur la branche cible"
        type: string
        required: false
        default: ""
      job_name:
        description: "Nom court du job (lettres, chiffres, - _ .)"
        type: string
        required: true
      lifeos_ref:
        description: "Réf lifeos cloné en référence"
        type: string
        required: false
        default: "main"
      timeout_minutes:
        description: "Durée max d'exécution opencode en minutes (10 à 90)"
        type: string
        required: false
        default: "45"
      model:
        description: "Modèle opencode à essayer en premier, ex. opencode/mimo-v2.6-flash-free (vide = ordre de models.txt)"
        type: string
        required: false
        default: ""
      start_phase:
        description: "Phase de départ du FullRun"
        type: choice
        required: false
        default: plan
        options:
          - plan
          - build
          - verify
          - close
      only:
        description: "Brick unique à exécuter (vera, serena, aditi-ui, engineer, anvil, forge-code, code-review, forge-audit, silas, max ; vide = tout)"
        type: string
        required: false
        default: ""
      attempt:
        description: "Numéro de tentative courante"
        type: string
        required: false
        default: "1"
      max_attempts:
        description: "Nombre maximum de tentatives"
        type: string
        required: false
        default: "3"

permissions:
  contents: read

jobs:
  vera:
    if: ${{ (inputs.only == '' || inputs.only == 'vera') && inputs.start_phase == 'plan' }}
    uses: ./.github/workflows/fr-plan-vera.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  serena:
    needs:
      - vera
    if: ${{ !cancelled() && (inputs.only == 'serena' || (inputs.only == '' && (needs.vera.result == 'skipped' || (needs.vera.result == 'success' && needs.vera.outputs.status == 'ok' && needs.vera.outputs.head_sha != '')))) && inputs.start_phase == 'plan' }}
    uses: ./.github/workflows/fr-plan-serena.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  aditi_ui:
    needs:
      - vera
      - serena
    if: ${{ !cancelled() && (inputs.only == 'aditi-ui' || (inputs.only == '' && (needs.vera.result == 'skipped' || (needs.vera.result == 'success' && needs.vera.outputs.status == 'ok' && needs.vera.outputs.head_sha != '')) && (needs.serena.result == 'skipped' || (needs.serena.result == 'success' && needs.serena.outputs.status == 'ok' && needs.serena.outputs.head_sha != '')))) && (inputs.start_phase == 'plan' || inputs.start_phase == 'build') }}
    uses: ./.github/workflows/fr-build-aditi-ui.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  engineer:
    needs:
      - vera
      - serena
    if: ${{ !cancelled() && (inputs.only == 'engineer' || (inputs.only == '' && (needs.vera.result == 'skipped' || (needs.vera.result == 'success' && needs.vera.outputs.status == 'ok' && needs.vera.outputs.head_sha != '')) && (needs.serena.result == 'skipped' || (needs.serena.result == 'success' && needs.serena.outputs.status == 'ok' && needs.serena.outputs.head_sha != '')))) && (inputs.start_phase == 'plan' || inputs.start_phase == 'build') }}
    uses: ./.github/workflows/fr-build-engineer.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  anvil:
    needs:
      - vera
      - serena
    if: ${{ !cancelled() && (inputs.only == 'anvil' || (inputs.only == '' && (needs.vera.result == 'skipped' || (needs.vera.result == 'success' && needs.vera.outputs.status == 'ok' && needs.vera.outputs.head_sha != '')) && (needs.serena.result == 'skipped' || (needs.serena.result == 'success' && needs.serena.outputs.status == 'ok' && needs.serena.outputs.head_sha != '')))) && (inputs.start_phase == 'plan' || inputs.start_phase == 'build') }}
    uses: ./.github/workflows/fr-build-anvil.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  forge_code:
    needs:
      - vera
      - serena
    if: ${{ !cancelled() && (inputs.only == 'forge-code' || (inputs.only == '' && (needs.vera.result == 'skipped' || (needs.vera.result == 'success' && needs.vera.outputs.status == 'ok' && needs.vera.outputs.head_sha != '')) && (needs.serena.result == 'skipped' || (needs.serena.result == 'success' && needs.serena.outputs.status == 'ok' && needs.serena.outputs.head_sha != '')))) && (inputs.start_phase == 'plan' || inputs.start_phase == 'build') }}
    uses: ./.github/workflows/fr-build-forge-code.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  code_review:
    needs:
      - vera
      - serena
      - aditi_ui
      - engineer
      - anvil
      - forge_code
    if: ${{ !cancelled() && (inputs.only == 'code-review' || (inputs.only == '' && (needs.vera.result == 'skipped' || (needs.vera.result == 'success' && needs.vera.outputs.status == 'ok' && needs.vera.outputs.head_sha != '')) && (needs.serena.result == 'skipped' || (needs.serena.result == 'success' && needs.serena.outputs.status == 'ok' && needs.serena.outputs.head_sha != '')) && (needs.aditi_ui.result == 'skipped' || (needs.aditi_ui.result == 'success' && needs.aditi_ui.outputs.status == 'ok' && needs.aditi_ui.outputs.head_sha != '')) && (needs.engineer.result == 'skipped' || (needs.engineer.result == 'success' && needs.engineer.outputs.status == 'ok' && needs.engineer.outputs.head_sha != '')) && (needs.anvil.result == 'skipped' || (needs.anvil.result == 'success' && needs.anvil.outputs.status == 'ok' && needs.anvil.outputs.head_sha != '')) && (needs.forge_code.result == 'skipped' || (needs.forge_code.result == 'success' && needs.forge_code.outputs.status == 'ok' && needs.forge_code.outputs.head_sha != '')))) && (inputs.start_phase == 'plan' || inputs.start_phase == 'build' || inputs.start_phase == 'verify') }}
    uses: ./.github/workflows/fr-verify-code-review.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  forge_audit:
    needs:
      - vera
      - serena
      - aditi_ui
      - engineer
      - anvil
      - forge_code
      - code_review
    if: ${{ !cancelled() && (inputs.only == 'forge-audit' || (inputs.only == '' && (needs.vera.result == 'skipped' || (needs.vera.result == 'success' && needs.vera.outputs.status == 'ok' && needs.vera.outputs.head_sha != '')) && (needs.serena.result == 'skipped' || (needs.serena.result == 'success' && needs.serena.outputs.status == 'ok' && needs.serena.outputs.head_sha != '')) && (needs.aditi_ui.result == 'skipped' || (needs.aditi_ui.result == 'success' && needs.aditi_ui.outputs.status == 'ok' && needs.aditi_ui.outputs.head_sha != '')) && (needs.engineer.result == 'skipped' || (needs.engineer.result == 'success' && needs.engineer.outputs.status == 'ok' && needs.engineer.outputs.head_sha != '')) && (needs.anvil.result == 'skipped' || (needs.anvil.result == 'success' && needs.anvil.outputs.status == 'ok' && needs.anvil.outputs.head_sha != '')) && (needs.forge_code.result == 'skipped' || (needs.forge_code.result == 'success' && needs.forge_code.outputs.status == 'ok' && needs.forge_code.outputs.head_sha != '')) && (needs.code_review.result == 'skipped' || (needs.code_review.result == 'success' && needs.code_review.outputs.status == 'ok' && needs.code_review.outputs.head_sha != '')))) && (inputs.start_phase == 'plan' || inputs.start_phase == 'build' || inputs.start_phase == 'verify') }}
    uses: ./.github/workflows/fr-verify-forge-audit.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  silas:
    needs:
      - vera
      - serena
      - aditi_ui
      - engineer
      - anvil
      - forge_code
      - code_review
      - forge_audit
    if: ${{ !cancelled() && (inputs.only == 'silas' || (inputs.only == '' && (needs.vera.result == 'skipped' || (needs.vera.result == 'success' && needs.vera.outputs.status == 'ok' && needs.vera.outputs.head_sha != '')) && (needs.serena.result == 'skipped' || (needs.serena.result == 'success' && needs.serena.outputs.status == 'ok' && needs.serena.outputs.head_sha != '')) && (needs.aditi_ui.result == 'skipped' || (needs.aditi_ui.result == 'success' && needs.aditi_ui.outputs.status == 'ok' && needs.aditi_ui.outputs.head_sha != '')) && (needs.engineer.result == 'skipped' || (needs.engineer.result == 'success' && needs.engineer.outputs.status == 'ok' && needs.engineer.outputs.head_sha != '')) && (needs.anvil.result == 'skipped' || (needs.anvil.result == 'success' && needs.anvil.outputs.status == 'ok' && needs.anvil.outputs.head_sha != '')) && (needs.forge_code.result == 'skipped' || (needs.forge_code.result == 'success' && needs.forge_code.outputs.status == 'ok' && needs.forge_code.outputs.head_sha != '')) && (needs.code_review.result == 'skipped' || (needs.code_review.result == 'success' && needs.code_review.outputs.status == 'ok' && needs.code_review.outputs.head_sha != '')) && (needs.forge_audit.result == 'skipped' || (needs.forge_audit.result == 'success' && needs.forge_audit.outputs.status == 'ok' && needs.forge_audit.outputs.head_sha != '')))) && (inputs.start_phase == 'plan' || inputs.start_phase == 'build' || inputs.start_phase == 'verify') }}
    uses: ./.github/workflows/fr-verify-silas.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  max:
    needs:
      - vera
      - serena
      - aditi_ui
      - engineer
      - anvil
      - forge_code
      - code_review
      - forge_audit
      - silas
    if: ${{ !cancelled() && (inputs.only == 'max' || (inputs.only == '' && (needs.vera.result == 'skipped' || (needs.vera.result == 'success' && needs.vera.outputs.status == 'ok' && needs.vera.outputs.head_sha != '')) && (needs.serena.result == 'skipped' || (needs.serena.result == 'success' && needs.serena.outputs.status == 'ok' && needs.serena.outputs.head_sha != '')) && (needs.aditi_ui.result == 'skipped' || (needs.aditi_ui.result == 'success' && needs.aditi_ui.outputs.status == 'ok' && needs.aditi_ui.outputs.head_sha != '')) && (needs.engineer.result == 'skipped' || (needs.engineer.result == 'success' && needs.engineer.outputs.status == 'ok' && needs.engineer.outputs.head_sha != '')) && (needs.anvil.result == 'skipped' || (needs.anvil.result == 'success' && needs.anvil.outputs.status == 'ok' && needs.anvil.outputs.head_sha != '')) && (needs.forge_code.result == 'skipped' || (needs.forge_code.result == 'success' && needs.forge_code.outputs.status == 'ok' && needs.forge_code.outputs.head_sha != '')) && (needs.code_review.result == 'skipped' || (needs.code_review.result == 'success' && needs.code_review.outputs.status == 'ok' && needs.code_review.outputs.head_sha != '')) && (needs.forge_audit.result == 'skipped' || (needs.forge_audit.result == 'success' && needs.forge_audit.outputs.status == 'ok' && needs.forge_audit.outputs.head_sha != '')) && (needs.silas.result == 'skipped' || (needs.silas.result == 'success' && needs.silas.outputs.status == 'ok' && needs.silas.outputs.head_sha != '')))) }}
    uses: ./.github/workflows/fr-close-max.yml
    with:
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
      chain: false
    secrets: inherit

  # Une étape qui a réussi sans commit ne doit pas laisser la chaîne continuer
  # silencieusement : ce garde-fou échoue pour que `loop` relance (ou que le run
  # apparaisse en échec). Les jobs sautés (phase ou `only`) sont ignorés ; `max`
  # est la dernière étape, son absence de commit ne bloque plus rien.
  gate:
    needs:
      - vera
      - serena
      - aditi_ui
      - engineer
      - anvil
      - forge_code
      - code_review
      - forge_audit
      - silas
      - max
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Vérifier que chaque étape exécutée a produit un commit
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          ok=$(printf '%s' "$NEEDS_JSON" | jq -r '
            ( [ to_entries[]
                | select(.value.result != "success" and .value.result != "skipped")
              ] | length == 0 )
            and
            ( [ to_entries[]
                | select(.key != "max")
                | select(.value.result == "success")
                | select((.value.outputs.status // "") != "ok" or (.value.outputs.head_sha // "") == "")
              ] | length == 0 )
          ')
          if [ "$ok" = "true" ]; then
            echo "Chaîne cohérente : chaque étape exécutée a produit un commit."
            exit 0
          fi
          echo "::error::étape réussie sans commit (ou annulée) : chaîne bloquée"
          exit 1

  loop:
    needs:
      - vera
      - serena
      - aditi_ui
      - engineer
      - anvil
      - forge_code
      - code_review
      - forge_audit
      - silas
      - max
      - gate
    if: ${{ !cancelled() && contains(needs.*.result, 'failure') && fromJSON(inputs.attempt) < fromJSON(inputs.max_attempts) }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: write
      contents: read
    steps:
      - name: Relancer le FullRun depuis build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IN_TARGET: ${{ inputs.target_repo }}
          IN_EXTRA: ${{ inputs.extra_repos }}
          LIFEOS_WRITE: ${{ inputs.lifeos_write }}
          IN_BRANCH: ${{ inputs.branch }}
          IN_PROMPT: ${{ inputs.prompt_path }}
          IN_ISA: ${{ inputs.isa_path }}
          IN_JOB: ${{ inputs.job_name }}
          LIFEOS_REF: ${{ inputs.lifeos_ref }}
          IN_TIMEOUT_MIN: ${{ inputs.timeout_minutes }}
          IN_MODEL: ${{ inputs.model }}
          IN_ONLY: ${{ inputs.only }}
          IN_ATTEMPT: ${{ inputs.attempt }}
          IN_MAX: ${{ inputs.max_attempts }}
        run: |
          set -euo pipefail
          next=$(( IN_ATTEMPT + 1 ))
          echo "Échec de la chaîne — relance depuis build (tentative ${next}/${IN_MAX})"
          # Même règle que _next.yml : ne transmettre `model` que si le workflow
          # visé (à la réf dispatchée) déclare l'entrée, sinon HTTP 422.
          wf_src=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/fr-fullrun.yml?ref=${GITHUB_REF_NAME}" \
            -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
          declares_model=0
          if printf '%s\n' "$wf_src" | awk '
              /^  workflow_dispatch:[[:space:]]*(#.*)?$/ { wd=1; ini=0; next }
              wd && /^  [^[:space:]]/ { wd=0; ini=0 }
              wd && /^    inputs:[[:space:]]*(#.*)?$/ { ini=1; next }
              wd && ini && /^    [^[:space:]]/ { ini=0 }
              wd && ini && /^      model:[[:space:]]*(#.*)?$/ { found=1 }
              END { exit(found ? 0 : 1) }
            '; then
            declares_model=1
          fi
          dispatch_args=(
            -f target_repo="$IN_TARGET"
            -f extra_repos="$IN_EXTRA"
            -F lifeos_write="$LIFEOS_WRITE"
            -f branch="$IN_BRANCH"
            -f prompt_path="$IN_PROMPT"
            -f isa_path="$IN_ISA"
            -f job_name="$IN_JOB"
            -f lifeos_ref="$LIFEOS_REF"
            -f timeout_minutes="$IN_TIMEOUT_MIN"
            -f start_phase=build
            -f only="$IN_ONLY"
            -f attempt="$next"
            -f max_attempts="$IN_MAX"
          )
          if [ "$declares_model" -ne 1 ]; then
            echo "model non transmis à fr-fullrun.yml (entrée absente sur $GITHUB_REF_NAME)"
          elif [ -n "$IN_MODEL" ]; then
            dispatch_args+=(-f model="$IN_MODEL")
          fi
          attempt=1
          while :; do
            if out=$(gh workflow run fr-fullrun.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref "$GITHUB_REF_NAME" \
              "${dispatch_args[@]}" 2>&1); then
              printf '%s\n' "$out"
              break
            fi
            printf '%s\n' "$out"
            # Seules les erreurs 5xx (API GitHub) méritent une nouvelle tentative.
            if ! printf '%s\n' "$out" \
                 | grep -Eq 'HTTP[[:space:]]*5[0-9][0-9]|status code[^0-9]*5[0-9][0-9]'; then
              echo "::error::dispatch refusé (non 5xx), abandon"
              exit 1
            fi
            if [ "$attempt" -ge 3 ]; then
              echo "::error::dispatch toujours en 5xx après 3 tentatives"
              exit 1
            fi
            echo "HTTP 5xx : nouvelle tentative dans 30 s (${attempt}/3)"
            sleep 30
            attempt=$((attempt + 1))
          done
