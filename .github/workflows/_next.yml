name: Agent next (lifeos-ci)

# Workflow réutilisable d'enchaînement FullRun.
# Table : vera → serena → engineer → anvil → forge-code → aditi-ui → forge-audit
#         → silas → code-review → max.
# Ne déclenche le workflow suivant que si le statut est « ok » et que le fichier
# fr-<phase>-<agent>.yml existe dans lifeos-ci. Jamais pour « quota ».
on:
  workflow_call:
    inputs:
      agent:
        description: "Agent qui vient de terminer"
        required: true
        type: string
      status:
        description: "Statut du run précédent (ok, quota, timeout, vide, erreur)"
        required: true
        type: string
      model:
        description: "Modèle utilisé par le run précédent"
        required: false
        type: string
        default: ""
      head_sha:
        description: "SHA du run précédent"
        required: false
        type: string
        default: ""
      target_repo:
        required: true
        type: string
      extra_repos:
        required: false
        type: string
        default: ""
      lifeos_write:
        required: false
        type: boolean
        default: false
      branch:
        required: true
        type: string
      prompt_path:
        required: true
        type: string
      isa_path:
        required: false
        type: string
        default: ""
      job_name:
        required: true
        type: string
      lifeos_ref:
        required: false
        type: string
        default: "main"
      timeout_minutes:
        required: false
        type: string
        default: "45"
      chain:
        description: "Propager l'enchaînement au lien suivant (défaut false)"
        required: false
        type: boolean
        default: false
    secrets:
      CI_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  next:
    if: github.actor == 'LordThiouk' && inputs.chain
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Enchaîner l'agent suivant (si autorisé)
        env:
          GH_TOKEN: ${{ secrets.CI_TOKEN }}
          IN_AGENT: ${{ inputs.agent }}
          STATUS: ${{ inputs.status }}
          IN_TARGET: ${{ inputs.target_repo }}
          IN_EXTRA: ${{ inputs.extra_repos }}
          LIFEOS_WRITE: ${{ inputs.lifeos_write }}
          IN_BRANCH: ${{ inputs.branch }}
          IN_PROMPT: ${{ inputs.prompt_path }}
          IN_ISA: ${{ inputs.isa_path }}
          IN_JOB: ${{ inputs.job_name }}
          LIFEOS_REF: ${{ inputs.lifeos_ref }}
          IN_TIMEOUT_MIN: ${{ inputs.timeout_minutes }}
          IN_MODEL: ${{ inputs.model }}
          IN_CHAIN: ${{ inputs.chain }}
        run: |
          set -euo pipefail
          # Le passage automatique n'est actif que si l'appelant l'a explicitement
          # demandé (assemblage FullRun complet). Un mini workflow reste à son étape.
          if [ "${IN_CHAIN:-false}" != "true" ]; then
            echo "chaîne désactivée (chain=${IN_CHAIN:-false}) : aucun lien suivant"
            exit 0
          fi
          if [ "${STATUS:-}" != "ok" ]; then
            if [ "${STATUS:-}" = "quota" ]; then
              echo "fin de chaîne : statut quota, aucun lien suivant"
            else
              echo "fin de chaîne : statut ${STATUS:-inconnu}, aucun lien suivant"
            fi
            exit 0
          fi
          chain="vera serena engineer anvil forge-code aditi-ui forge-audit silas code-review max"
          next_agent=""
          found=0
          for a in $chain; do
            if [ "$found" -eq 1 ]; then
              next_agent="$a"
              break
            fi
            [ "$a" = "$IN_AGENT" ] && found=1
          done
          if [ -z "$next_agent" ]; then
            echo "fin de chaîne : ${IN_AGENT:-?} est le dernier agent"
            exit 0
          fi
          case "$next_agent" in
            vera|serena) phase="plan" ;;
            engineer|anvil|forge-code|aditi-ui) phase="build" ;;
            forge-audit|silas|code-review) phase="verify" ;;
            max) phase="close" ;;
            *) echo "::error::phase inconnue pour $next_agent"; exit 1 ;;
          esac
          next_wf="fr-${phase}-${next_agent}.yml"
          if ! gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${next_wf}" >/dev/null 2>&1; then
            echo "fin de chaîne : workflow suivant absent ($next_wf)"
            exit 0
          fi
          # On dispatche le lien suivant sur la MÊME réf que le run courant. Sans
          # --ref, `gh workflow run` retombe sur la branche par défaut (main), dont
          # la version de _next.yml exige `actions: write` : le job `next` du lien
          # (contenu à `contents: read`) échouait alors en startup_failure
          # (run fr-plan-serena 45747836096).
          dispatch_ref="${GITHUB_REF_NAME:-}"
          if [ -z "$dispatch_ref" ]; then
            echo "::error::réf de dispatch introuvable"
            exit 1
          fi
          wf_src=$(gh api "repos/${GITHUB_REPOSITORY}/contents/.github/workflows/${next_wf}?ref=${dispatch_ref}" \
            -H "Accept: application/vnd.github.raw" 2>/dev/null || true)
          # N'envoyer une entrée que si le workflow visé la déclare, sinon
          # l'API répond 422 « Unexpected inputs provided ».
          wf_declares() {
            printf '%s\n' "$wf_src" | awk -v key="$1" '
              /^  workflow_dispatch:[[:space:]]*(#.*)?$/ { wd=1; ini=0; next }
              wd && /^  [^[:space:]]/ { wd=0; ini=0 }
              wd && /^    inputs:[[:space:]]*(#.*)?$/ { ini=1; next }
              wd && ini && /^    [^[:space:]]/ { ini=0 }
              wd && ini && $0 ~ ("^      " key ":") { found=1 }
              END { exit(found ? 0 : 1) }
            '
          }
          declares_model=0
          wf_declares model && declares_model=1
          declares_chain=0
          wf_declares chain && declares_chain=1
          dispatch_args=(
            -f target_repo="$IN_TARGET"
            -f extra_repos="$IN_EXTRA"
            -F lifeos_write="$LIFEOS_WRITE"
            -f branch="$IN_BRANCH"
            -f prompt_path="$IN_PROMPT"
            -f isa_path="$IN_ISA"
            -f job_name="$IN_JOB"
            -f lifeos_ref="$LIFEOS_REF"
            -f timeout_minutes="$IN_TIMEOUT_MIN"
          )
          if [ "$declares_model" -ne 1 ]; then
            echo "model non transmis à $next_wf (entrée absente sur $dispatch_ref)"
          elif [ -n "$IN_MODEL" ]; then
            dispatch_args+=(-f model="$IN_MODEL")
          fi
          if [ "$declares_chain" -eq 1 ]; then
            dispatch_args+=(-F chain=true)
          else
            echo "::warning::chain non déclaré par $next_wf sur $dispatch_ref : le lien suivant ne se propagera pas"
          fi
          gh workflow run "$next_wf" --repo "$GITHUB_REPOSITORY" --ref "$dispatch_ref" "${dispatch_args[@]}"
          echo "lien suivant dispatché : $next_wf ($next_agent, phase $phase) sur $dispatch_ref"
