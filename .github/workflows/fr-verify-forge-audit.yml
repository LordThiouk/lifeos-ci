name: FullRun verify-forge-audit (lifeos-ci)
run-name: FullRun verify-forge-audit ${{ inputs.job_name }} → ${{ inputs.target_repo }}@${{ inputs.branch }}

# Brique verify-forge-audit : agent Forge. Puis enchaînement _next.yml si status == ok.
on:
  workflow_dispatch:
    inputs:
      target_repo:
        description: "Dépôt cible (liste blanche targets/allowed-repos.sh)"
        type: choice
        required: true
        default: antenly
        options:
          - antenly
          - antenly-ci
          - galass-ci
          - Galass_Rider
          - Galass_Driver
          - Galass_backend
          - galass-emu-actions-pub
          - lifeos
          - lifeos-ci
      extra_repos:
        description: "Dépôts supplémentaires, séparés par des virgules ou espaces (vide = aucun)"
        type: string
        required: false
        default: ""
      lifeos_write:
        description: "Autoriser l'écriture vers LordThiouk/lifeos (branche + PR uniquement)"
        type: boolean
        required: false
        default: false
      branch:
        description: "Branche de fonctionnalité du dépôt cible, déjà poussée (jamais main/master)"
        type: string
        required: true
      prompt_path:
        description: "prompts:<chemin sur fullrun-prompts de lifeos-ci> ou target:<chemin sur la branche cible>"
        type: string
        required: true
      isa_path:
        description: "Chemin optionnel de l'ISA sur la branche cible"
        type: string
        required: false
        default: ""
      job_name:
        description: "Nom court du job (lettres, chiffres, - _ .)"
        type: string
        required: true
      lifeos_ref:
        description: "Réf lifeos cloné en référence"
        type: string
        required: false
        default: "main"
      timeout_minutes:
        description: "Durée max d'exécution opencode en minutes (10 à 90)"
        type: string
        required: false
        default: "10"
      model:
        description: "Modèle opencode à essayer en premier (vide = ordre de models.txt)"
        type: string
        required: false
        default: ""
      chain:
        description: "Enchaîner le job _next.yml si le run est ok"
        type: boolean
        required: false
        default: false
  workflow_call:
    inputs:
      target_repo:
        description: "Dépôt cible (liste blanche targets/allowed-repos.sh)"
        type: string
        required: true
      extra_repos:
        description: "Dépôts supplémentaires, séparés par des virgules ou espaces (vide = aucun)"
        type: string
        required: false
        default: ""
      lifeos_write:
        description: "Autoriser l'écriture vers LordThiouk/lifeos (branche + PR uniquement)"
        type: boolean
        required: false
        default: false
      branch:
        description: "Branche de fonctionnalité du dépôt cible, déjà poussée (jamais main/master)"
        type: string
        required: true
      prompt_path:
        description: "prompts:<chemin sur fullrun-prompts de lifeos-ci> ou target:<chemin sur la branche cible>"
        type: string
        required: true
      isa_path:
        description: "Chemin optionnel de l'ISA sur la branche cible"
        type: string
        required: false
        default: ""
      job_name:
        description: "Nom court du job (lettres, chiffres, - _ .)"
        type: string
        required: true
      lifeos_ref:
        description: "Réf lifeos cloné en référence"
        type: string
        required: false
        default: "main"
      timeout_minutes:
        description: "Durée max d'exécution opencode en minutes (10 à 90)"
        type: string
        required: false
        default: "10"
      model:
        description: "Modèle opencode à essayer en premier (vide = ordre de models.txt)"
        type: string
        required: false
        default: ""
      chain:
        description: "Enchaîner le job _next.yml si le run est ok"
        type: boolean
        required: false
        default: false

    outputs:
      status:
        description: "Statut opencode du run"
        value: ${{ jobs.run.outputs.status }}
      model:
        description: "Modèle opencode utilisé"
        value: ${{ jobs.run.outputs.model }}
      head_sha:
        description: "SHA poussé par le run"
        value: ${{ jobs.run.outputs.head_sha }}

permissions:
  contents: read

jobs:
  run:
    uses: ./.github/workflows/_agent-run.yml
    with:
      agent: forge-audit
      target_agent: Forge
      stop_after_step: "5"
      chain_phase: verify
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      model: ${{ inputs.model }}
    secrets: inherit

  next:
    needs: run
    if: inputs.chain && needs.run.outputs.status == 'ok'
    uses: ./.github/workflows/_next.yml
    with:
      agent: forge-audit
      status: ${{ needs.run.outputs.status }}
      model: ${{ needs.run.outputs.model }}
      head_sha: ${{ needs.run.outputs.head_sha }}
      target_repo: ${{ inputs.target_repo }}
      extra_repos: ${{ inputs.extra_repos }}
      lifeos_write: ${{ inputs.lifeos_write }}
      branch: ${{ inputs.branch }}
      prompt_path: ${{ inputs.prompt_path }}
      isa_path: ${{ inputs.isa_path }}
      job_name: ${{ inputs.job_name }}
      lifeos_ref: ${{ inputs.lifeos_ref }}
      timeout_minutes: ${{ inputs.timeout_minutes }}
      chain: true
    secrets: inherit
